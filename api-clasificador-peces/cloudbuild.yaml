steps:
  # Paso 1: Construir la imagen desde el Dockerfile dentro de api-accident-reporter
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'gcr.io/clasificador-peces/api-cp:latest',
      '-f', 'api-clasificador-peces/Dockerfile',
      'api-clasificador-peces'
    ]

  # Paso 2: Subir la imagen al registro de contenedores
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/clasificador-peces/api-cp:latest']

  # Paso 3: Desplegar en Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      [
        'run', 'deploy', 'servicio-api-cp',
        '--image', 'gcr.io/clasificador-peces/api-cp:latest',
        '--region', 'us-central1',
        '--platform', 'managed',
        '--allow-unauthenticated'
      ]

options:
  logging: CLOUD_LOGGING_ONLY